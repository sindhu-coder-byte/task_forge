{% extends "core/base.html" %}
{% load static %}

{% block title %}Reset password — VetriFlow{% endblock %}

{% block content %}
<div style="
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1d4ed8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: 'Inter', sans-serif;
  position: relative;
  overflow: hidden;
">

  <!-- Decorative blurred orbs -->
  <div style="
    position: absolute; top: -120px; right: -120px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(99,102,241,.35) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  "></div>
  <div style="
    position: absolute; bottom: -80px; left: -80px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(59,130,246,.3) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  "></div>

  <!-- Card -->
  <div style="
    position: relative; z-index: 1;
    width: 100%; max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  ">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <i class="ri-rocket-2-line" style="font-size:22px;color:#4f46e5;"></i>
      <span style="font-size:18px;font-weight:700;color:#111827;letter-spacing:-.3px;">VetriFlow</span>
    </div>

    <h3 class="tf-auth-title" style="margin:10px 0 4px;">Set a new password</h3>
    <p style="margin:0 0 20px;font-size:13px;color:#6b7280;line-height:1.5;">
      Choose a new password for your account.
    </p>

    <form method="POST">
      {% csrf_token %}

      <div class="input-group">
        <i class="ri-lock-line"></i>
        <input type="password" id="newPassword" name="password" placeholder="New password" required autocomplete="new-password">
        <i class="ri-eye-line toggle" onclick="togglePassword('newPassword')" title="Show password"></i>
      </div>

      <div class="input-group">
        <i class="ri-lock-2-line"></i>
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm new password" required autocomplete="new-password">
        <i class="ri-eye-line toggle" onclick="togglePassword('confirmPassword')" title="Show password"></i>
      </div>

      <button type="submit" class="tf-auth-btn">Reset password</button>
    </form>

    <p class="tf-auth-footer" style="margin-top:18px;">
      <a href="{% url 'core:login' %}" class="tf-auth-link">
        <i class="ri-arrow-left-line"></i> Back to sign in
      </a>
    </p>
  </div>

</div>
{% endblock %}
