{% extends "core/base.html" %}
{% load static %}

{% block title %}Sign in — TaskForge{% endblock %}

{% block content %}
<!-- AUTH PAGE BACKGROUND -->
<div style="
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1d4ed8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: 'Inter', sans-serif;
  position: relative;
  overflow: hidden;
">

  <!-- Decorative blurred orbs -->
  <div style="
    position: absolute; top: -120px; right: -120px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(99,102,241,.35) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  "></div>
  <div style="
    position: absolute; bottom: -80px; left: -80px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(59,130,246,.3) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  "></div>

  <!-- Centre card — just a minimal placeholder; the real UI is the modal -->
  <div style="
    text-align: center;
    color: rgba(255,255,255,.6);
    font-size: 13px;
    position: relative;
    z-index: 1;
  ">
    <div style="
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    ">
      <i class="ri-rocket-2-line" style="font-size:28px;color:#fff;"></i>
      <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-.3px;">TaskForge</span>
    </div>
    <p style="margin:0;color:rgba(255,255,255,.45);font-size:13px;">
      Loading sign-in…
    </p>
  </div>

</div>

<script>
  (function () {
    var tab = "{{ initialTab|default:'login' }}";
    var tries = 0;

    function tryOpen() {
      if (typeof window.openAuth === "function") {
        window.openAuth(tab);
        return;
      }
      tries += 1;
      if (tries < 100) window.setTimeout(tryOpen, 25);
    }

    if (document.readyState === "complete") {
      tryOpen();
    } else {
      window.addEventListener("load", tryOpen);
    }
  })();
</script>
{% endblock %}
