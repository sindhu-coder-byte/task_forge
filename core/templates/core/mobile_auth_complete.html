<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signing you in&hellip;</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; background: #fff; color: #222; text-align: center; }
  </style>
</head>
<body>
  <div>
    <p>Signed in. Returning to the app&hellip;</p>

  </div>
  <script>
    window.location.href = "{{ deep_link_base }}?token={{ token|urlencode }}";
  </script>
</body>
</html>
